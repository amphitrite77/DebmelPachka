<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Твоя дембельская пачка</title>

  <style>
    :root {
      --bg: #f8f5ef;
      --ink: #292722;
      --red: #d94b45;
      --paper: #fffdf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background: var(--bg);
      font-family: "Courier New", monospace;
    }

    main {
      width: min(100%, 420px);
      text-align: center;
    }

    .scene {
      min-height: 85vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 22px;
      padding-top: 12vh;
    }

    button {
      display: block;
      max-width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(.98);
    }

    .art {
      display: block;
      width: min(82vw, 340px);
      height: min(82vw, 340px);
      object-fit: contain;
      image-rendering: pixelated;
    }

    .pack-image {
       transform: translateX(60px);
    }

    .cigarette-art {
      width: min(90vw, 480px);
      height: auto;
      max-height: 230px;
      transform: none;
    }

    .caption {
      min-height: 30px;
      font-size: 18px;
      line-height: 1.5;
    }


.fact {
  margin-top: 24px;
  max-width: 320px;
  color: #716c62;
  font-size: 12px;
  line-height: 1.4;
}


    .heart {
      color: var(--red);
      font-family: sans-serif;
      font-size: 24px;
    }

    .wish {
      max-width: 320px;
      padding: 16px;
      border: 2px solid var(--ink);
      background: var(--paper);
      line-height: 1.5;
      box-shadow: 4px 4px 0 #d8d2c7;
    }

.final-wish {
  width: min(90vw, 600px);
  min-height: 260px;
  display: grid;
  place-items: center;
  padding: 32px;
  font-size: 24px;
  line-height: 1.6;
  color: #292722;
}


    .hint {
      margin: 0;
      color: #716c62;
      font-size: 12px;
    }

    .error {
      max-width: 320px;
      color: #a32626;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main>
    <section class="scene" id="scene" aria-live="polite"></section>
  </main>

<script>
  const scene = document.getElementById("scene");


// Для теста укажи число от 1 до 20.
// Поставь 0, чтобы включить обычный режим по календарю.
const TEST_DAY = 0;


  // Временные тексты — позже заменим твоими пожеланиями.
  // Порядок: первый элемент — 12 ноября, последний — 1 декабря.
 

const wishes = [
  "С началом дембельской пачки, котенок^^ Люблю тебя в 20 раз сильнее, чем ты меня)♥",
  "Ты моя главная радость в жизни♥",
  "Ты самый милый на свете! Всю службу пересматривала твои фотографии)♥",
  "Ты очень сильный, смог перенести целый год в армии!♥",
  "Ты мое сердце из чистого золота, и я спасу тебя от холода (уже через 16 дней)♥",
  "Ты для меня самый дорогой человек на Земле^^♥",
  "Безумно скучаю по тебе уже больше года!♥",
  "Мой дом там, где ты♥",
  "Нам очень повезло встретить друг друга в этом огромном мире♥",
  "Рядом с тобой мне всегда так комфортно и тепло^^♥",
  "Уже нет половины пачки! Осталось совсем немножко друг без друга♥",
  "Завтра я уже буду с тобой в одном городе! Мы уже так скоро увидимся♥",
  "Очень хочу тебя поцеловать^^♥",
  "Хочу уже поскорее обнять тебя и больше не отпускать♥",
  "Осталась одна неделя! Начинай паковать вещи))♥",
  "Жду своего люблюшкина дома^^♥",
  "Мой сладкий котенок, выходи скорее, я тебя СЪЕМ!!!♥",
  "Думаю о тебе прямо сейчас!♥",
  "Уже считаю минуты до нашей встречи)♥",
  "Все закончилось! Завтра домой! Мы справились!"
];


const facts = [
	"20 это столько же, сколько молочных зубов у людей!",
	"Чтобы лунные фазы Луны появились снова в один и тот же день года, требуется примерно 19 лет.",
	"В Китае число 18 считается очень счастливым, так как по звучанию напоминает фразу «непременно разбогатеть» или «десять процветаний». А еще это возраст, когда я познакомилась с тобой)",
	"В фильме <Матрица> число 17 играет важную роль. Это число появляется на экране во многих кадрах, и кажется, что оно имеет особое значение для сценаристов и режиссеров фильма",
	"У гусениц ровно 16 ног (по мере превращения в бабочку или мотылька их число сокращается до 6 )",
	"Первое суп-блюдо, которое было съедено в космосе (на борту корабля «Аполлон»), готовилось ровно 15 минут путем регидратации сухого концентрата.",
	"Из-за страха перед числом 13 во многих зданиях после 12-го этажа сразу идет 14-й этаж",
	"Если бы человечество пользовалось Международным фиксированным календарём, в году было бы ровно 13 месяцев (по 28 дней в каждом).",
	"На данный момент за всю историю человечества на поверхности Луны побывало ровно 12 человек. Последним из них был Харрисон Шмитт в 1972 году.",
	"Мировой рекорд по самому долгому бодрствованию без использования стимуляторов принадлежит Рэнди Гарднеру. В 1964 году он смог не спать ровно 11 суток (264 часа).",
	"Большинство людей на планете пользуются десятичной системой счисления (потому что у нас 10 пальцев на руках).",
	"Девятый вал: Согласно старинному морскому поверью, во время шторма каждая девятая волна является самой сильной, опасной и разрушительной.",
	"В Древнем Риме до перехода на привычный нам календарь существовала 8-дневная неделя (нундины). Семь дней люди работали, а на 8-й день съезжались на рынок в города, чтобы торговать, отдыхать и читать законы.",
	"Семь чудес света: Классический список величайших творений античности включает ровно 7 объектов.",
	"Из-за уникальной структуры водородных связей в молекуле воды кристаллический лед всегда формирует шестиугольную решетку. Поэтому абсолютно все снежинки имеют строго 6 граней или лучей.",
	"У обычного дождевого червя нет одного центрального сердца. Вместо этого его жизнь поддерживают 5 пар сокращающихся сосудов (так называемые «боковые сердца»), которые перегоняют кровь по организму.",
	"Четырёхлистный клевер: Шанс найти его в дикой природе равен 1 к 10 000",
	"Число 3 считается невезучим в некоторых культурах. Во Вьетнаме его боятся, так как местные жители верят, что оно принесет беду. Здесь существует поверье, что при изображении трех людей на фотографии, стоящий посередине может умереть.",
	"В мифологии и культуре число 2 олицетворяет полярность и дуализм — день и ночь, инь и ян, добро и зло. В римской мифологии двуликий бог времени Янус символизировал переход из прошлого в будущее.",
	"Современная лошадь ходит на одном-единственном пальце каждой ноги. В процессе эволюции их предки потеряли остальные пальцы, а средний превратился в мощное копыто, позволяющее развивать огромную скорость на твердой земле.",
];


  // Часовой пояс компьютера/телефона посетителя.
  // Дата открывается в местную полночь.
  const START = new Date(2026, 10, 12, 0, 0, 0);

  const PREVIEW = true;


  const END = new Date(2026, 11, 2, 0, 0, 0); // после последней сигареты
  const DAY_MS = 24 * 60 * 60 * 1000;




  function todayIndex() {
  if (TEST_DAY >= 1 && TEST_DAY <= 20) return TEST_DAY - 1;

  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  if (today < START) return -1;
  if (today >= END) return 19;

  return Math.floor((today - START) / DAY_MS);
}





  function typeText(element, text, speed = 65) {
    let i = 0;
    const timer = setInterval(() => {
      if (!element.isConnected) {
        clearInterval(timer);
        return;
      }

      element.textContent += text[i++];
      if (i >= text.length) {
        clearInterval(timer);
        element.innerHTML += ' <span class="heart">♥</span>';
      }
    }, speed);
  }

  function makeImageButton(filename, alt, className, onClick) {
    const button = document.createElement("button");
    button.type = "button";
    button.setAttribute("aria-label", alt);

    const img = document.createElement("img");
    img.src = filename;
    img.alt = alt;
    img.className = className;

    img.onerror = () => {
      const error = document.createElement("p");
      error.className = "error";
      error.textContent = `Не удалось загрузить «${filename}».`;
      button.replaceWith(error);
    };

    button.appendChild(img);
    button.addEventListener("click", onClick);
    return button;
  }

  function showClosedPack() {
    scene.replaceChildren();

    const caption = document.createElement("div");
    caption.className = "caption";

    const hint = document.createElement("p");
    hint.className = "hint";
    hint.textContent = "Нажми на пачку";

    scene.append(
      makeImageButton("closed.png", "Закрытая пачка", "art pack-image", showOpenPack),
      caption,
      hint
    );

    typeText(caption, "Твоя дембельская пачка");
  }

  function showOpenPack() {
    scene.replaceChildren();

    const index = todayIndex();

    if (index < 0) {
      const caption = document.createElement("div");
      caption.className = "caption";
      caption.textContent = "Пачка открывается 12 ноября ♥";

      scene.append(
        makeImageButton("closed.png", "Закрытая пачка", "art pack-image", showOpenPack),
        caption
      );
      return;
    }

    const remaining = Math.max(0, 20 - index);
    const filename = `open-${remaining}.png`;

    scene.append(
      makeImageButton(filename, `В пачке осталось сигарет: ${remaining}`, "art pack-image", () => {
        showCigarette(index);
      })
    );

    const caption = document.createElement("div");
    caption.className = "caption";
    caption.textContent = remaining === 1
      ? "Последняя сигарета ♥"
      : `Осталось сигарет: ${remaining}`;

    const hint = document.createElement("p");
    hint.className = "hint";
    hint.textContent = "Нажми на пачку, чтобы достать сегодняшнюю сигарету";

const fact = document.createElement("div");
fact.className = "fact";
fact.textContent = facts[20 - remaining];

    scene.append(caption, hint, fact);
  }

  function showCigarette(index) {
    scene.replaceChildren();

    const button = makeImageButton(
      "cigarette.png",
      "Сигарета",
      "art cigarette-art",
      () => showWish(index, button)
    );

    const caption = document.createElement("div");
    caption.className = "caption";
    caption.textContent = `День ${index + 1} из 20`;

    const hint = document.createElement("p");
    hint.className = "hint";
    hint.textContent = "Нажми на сигарету";

    scene.append(button, caption, hint);
  }

  function showWish(index, button) {
  const img = button.querySelector("img");
  img.src = "cigarette-lit.png";
  img.alt = "Зажжённая пиксельная сигарета";

  const hint = scene.querySelector(".hint");
  if (hint) hint.remove();

  let wish = scene.querySelector(".wish");

  if (!wish) {
    wish = document.createElement("div");
    wish.className = "wish";
    scene.append(wish);
  }

  wish.textContent = wishes[index];

  // Финальный переход появляется только после пожелания 20-го дня.
  if (index === 19) {
    wish.tabIndex = 0;
    wish.setAttribute("role", "button");
    wish.setAttribute("aria-label", "Открыть финальное поздравление");
    wish.style.cursor = "pointer";
    wish.addEventListener("click", showBlackScreen, { once: true });
  }
}

function showBlackScreen() {
  scene.replaceChildren();
  document.body.style.background = "#641f26";
  document.body.style.color = "#fff";

  scene.style.minHeight = "85vh";
  scene.style.cursor = "pointer";
  scene.setAttribute("role", "button");
  scene.setAttribute("aria-label", "Продолжить");
  scene.onclick = showFirstLetter;
}

function showFirstLetter() {
  scene.onclick = showSecondLetter;
  showLetterImage("letter-appear.png", "Первое изображение письма");
}

function showSecondLetter() {
  scene.onclick = showFinalWish;
  showLetterImage("letter-appear-2.png", "Второе изображение письма");
}

function showLetterImage(filename, alt) {
  scene.replaceChildren();

  const img = document.createElement("img");
  img.src = filename;
  img.alt = alt;
  img.className = "art";

  img.onerror = () => {
    img.replaceWith(makeMissingImageMessage(filename));
  };

  scene.append(img);
}

function showFinalWish() {
  scene.replaceChildren();
  scene.onclick = null;

  const finalWish = document.createElement("div");
  finalWish.className = "wish final-wish";
  finalWish.textContent = "Мы это сделали! Мы справились с таким испытанием, преодолели, казалось бы, непосильное. Мне очень волнительно какое будущее нас ждет, но я рада, что вот уже завтра мы будем вместе столько, сколько сами того захотим. Я безмерно тебя люблю. Твоя Саша ♥";

  scene.append(finalWish);
}

  // showClosedPack();


// Дополнение: одна сигарета в день и таймер закрытой пачки.
(() => {
  const AUTO_CLOSE_SECONDS = 20;

  const originalShowClosedPack = showClosedPack;
  const originalShowOpenPack = showOpenPack;
  const originalShowWish = showWish;

  let countdownTimer = null;
  let autoCloseTimer = null;

  // Резервное хранение на время открытой страницы,
  // если браузер запретил localStorage.
  const openedInMemory = new Set();

  function isTestMode() {
    return TEST_DAY >= 1 && TEST_DAY <= 20;
  }

  function storageKey(index) {
    const mode = isTestMode() ? "test" : "calendar";

    // Тестовый и обычный режимы хранятся отдельно.
    return `daily-pack:2026-11-12:${mode}:day-${index + 1}`;
  }

  function wasOpened(index) {
    if (index < 0) return false;

    const key = storageKey(index);

    if (openedInMemory.has(key)) return true;

    try {
      return localStorage.getItem(key) === "opened";
    } catch {
      return false;
    }
  }

  function rememberOpened(index) {
    const key = storageKey(index);
    openedInMemory.add(key);

    try {
      localStorage.setItem(key, "opened");
    } catch {
      console.warn(
        "Сохранение недоступно: после перезагрузки страницы " +
        "пачка может снова открыться."
      );
    }
  }

  function clearPackTimers() {
    clearInterval(countdownTimer);
    clearTimeout(autoCloseTimer);

    countdownTimer = null;
    autoCloseTimer = null;
  }

  function nextMidnight() {
    const now = new Date();

    // Именно следующая местная полночь, а не просто +24 часа.
    return new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate() + 1,
      0, 0, 0, 0
    );
  }

  function formatTime(milliseconds) {
    const total = Math.max(0, Math.ceil(milliseconds / 1000));

    const days = Math.floor(total / 86400);
    const hours = Math.floor((total % 86400) / 3600);
    const minutes = Math.floor((total % 3600) / 60);
    const seconds = total % 60;

    const pad = value => String(value).padStart(2, "0");

    const time = `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;

    return days > 0 ? `${days} дн. ${time}` : time;
  }

  function makeTextButton(text, onClick) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "pack-action";
    button.textContent = text;
    button.addEventListener("click", onClick);

    return button;
  }

  // Заменяем экран закрытой пачки.
  showClosedPack = function () {
    clearPackTimers();

    const index = todayIndex();

    // Сегодня ещё ничего не открывали — обычная закрытая пачка.
    if (index >= 0 && !wasOpened(index)) {
      originalShowClosedPack();
      return;
    }

    scene.replaceChildren();

    const pack = makeImageButton(
      "closed.png",
      "Закрытая пачка",
      "art pack-image",
      () => {}
    );

    // Пока идёт ожидание, пачку открыть нельзя.
    pack.disabled = true;
    pack.style.opacity = "1";
    pack.style.cursor = "default";

    const caption = document.createElement("div");
    caption.className = "caption";

    scene.append(pack, caption);

    // После последнего дня ожидать следующую сигарету уже не нужно.
    if (index === 19 && wasOpened(index)) {
      caption.textContent = "Это была последняя сигарета ♥";

      scene.append(
        makeTextButton(
          "Открыть финальное поздравление ♥",
          showBlackScreen
        )
      );

      return;
    }

    const beforeStart = index < 0;
    const target = beforeStart ? new Date(START) : nextMidnight();

    caption.textContent = beforeStart
      ? "Пачка откроется 12 ноября ♥"
      : "Сегодняшняя сигарета уже открыта ♥";

    const countdown = document.createElement("p");
    countdown.className = "hint pack-countdown";
    countdown.style.fontVariantNumeric = "tabular-nums";

    scene.append(countdown);

    function updateCountdown() {
      if (!countdown.isConnected) {
        clearInterval(countdownTimer);
        countdownTimer = null;
        return;
      }

      const remaining = target.getTime() - Date.now();

      if (remaining <= 0) {
        showClosedPack();
        return;
      }

      countdown.textContent = (
        beforeStart
          ? "До открытия пачки: "
          : "До следующей сигареты: "
      ) + formatTime(remaining);
    }

    countdownTimer = setInterval(updateCountdown, 1000);
    updateCountdown();
  };

  // Дополнительная проверка перед открытием пачки.
  showOpenPack = function () {
    clearPackTimers();

    const index = todayIndex();

    if (index < 0 || wasOpened(index)) {
      showClosedPack();
      return;
    }

    originalShowOpenPack();
  };

  // Запоминаем открытие после появления пожелания.
  showWish = function (index, button) {
    // Защита от повторных нажатий на ту же сигарету.
    if (button.disabled) return;
    button.disabled = true;

    originalShowWish(index, button);
    rememberOpened(index);

    const closeButton = makeTextButton(
      "Закрыть пачку ♥",
      showClosedPack
    );

    scene.append(closeButton);

    // В последний день сохраняем твой переход:
    // нажатие на пожелание → финальное поздравление.
    // Автоматически закрывать этот экран не будем.
    if (index === 19) return;

    const hint = document.createElement("p");
    hint.className = "hint";
    hint.textContent =
      `Пачка закроется через ${AUTO_CLOSE_SECONDS} секунд ♥`;

    scene.append(hint);

    autoCloseTimer = setTimeout(
      showClosedPack,
      AUTO_CLOSE_SECONDS * 1000
    );
  };

  showClosedPack();
})();



</script>
</body>
</html>
